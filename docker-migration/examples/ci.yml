# ============================================================
# CI · 质量门禁（push / PR → main）。不含部署，**不需要任何凭据**。
# 建议第一步就上它：立刻拿到「编译 / 类型错误在提交阶段暴露」。
# ============================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend · build & test (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend            # ← 按你的目录结构改
    steps:
      - uses: actions/checkout@v4

      # 不需要 mvn wrapper：setup-java 自带 mvn；cache: maven 自动匹配 **/pom.xml
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build & test
        run: mvn -B -ntp verify

  frontend:
    name: frontend · typecheck & build (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend           # ← 按你的目录结构改
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json   # ← 缓存要显式指路

      - name: Install dependencies
        run: npm ci

      - name: Type-check & build
        run: npm run build                    # 例：vue-tsc --noEmit && vite build
