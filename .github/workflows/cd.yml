# ============================================================
# we1l.site · CD
#
#   1) push tag v*      → build-push：构建并推 ACR（:backend/:frontend + :backend-<tag>/:frontend-<tag>）
#   2) workflow_dispatch（手填 version）→ promote：把 :backend-<ver>/:frontend-<ver>
#                                          重新提升为 :backend/:frontend = 【发布回滚/定点发布】
#   两路都汇到 deploy：受限 SSH 触发 B 机 remote-deploy.sh（pull + up -d）→ 冒烟
#
# Secrets：ACR_REGISTRY / ACR_USERNAME / ACR_PASSWORD；B_HOST / B_USER / B_SSH_KEY_B64
# 回滚设计说明：版本选择放在 CI 侧（CI 有 ACR 凭据）。
#   这样 B 机 .env.prod 保持 root 属主、ops 无需写权限 →
#   避免「ops 可指定任意镜像 + NOPASSWD compose up」造成的免密提权面。
# ============================================================
name: CD

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "回滚/定点发布的版本 tag（例：v1.0.0）"
        required: true

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    name: build & push to ACR
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to ACR
        run: |
          set -euo pipefail
          printf '%s' "${{ secrets.ACR_PASSWORD }}" | \
            docker login -u "${{ secrets.ACR_USERNAME }}" --password-stdin "${{ secrets.ACR_REGISTRY }}"

      - name: Build & push backend
        env:
          IMG: ${{ secrets.ACR_REGISTRY }}/we1l/site
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          docker build --provenance=false --sbom=false \
            -t "$IMG:backend" -f we1l.site/we1l-backend/Dockerfile we1l.site/we1l-backend
          docker tag "$IMG:backend" "$IMG:backend-$TAG"
          docker push "$IMG:backend"
          docker push "$IMG:backend-$TAG"

      - name: Build & push frontend
        env:
          IMG: ${{ secrets.ACR_REGISTRY }}/we1l/site
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          docker build --provenance=false --sbom=false \
            -t "$IMG:frontend" -f we1l.site/we1l-frontend/Dockerfile we1l.site/we1l-frontend
          docker tag "$IMG:frontend" "$IMG:frontend-$TAG"
          docker push "$IMG:frontend"
          docker push "$IMG:frontend-$TAG"

  promote:
    name: rollback · promote version to current
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Login to ACR
        run: |
          set -euo pipefail
          printf '%s' "${{ secrets.ACR_PASSWORD }}" | \
            docker login -u "${{ secrets.ACR_USERNAME }}" --password-stdin "${{ secrets.ACR_REGISTRY }}"

      - name: Promote version tags to current
        env:
          IMG: ${{ secrets.ACR_REGISTRY }}/we1l/site
          VER: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          case "$VER" in v[0-9]*) : ;; *) echo "::error::版本需形如 v1.2.3：'$VER'"; exit 2 ;; esac
          case "$VER" in *[!A-Za-z0-9._-]*) echo "::error::版本含非法字符：'$VER'"; exit 2 ;; esac
          for svc in backend frontend; do
            echo "==> promote $svc-$VER  ->  $svc"
            docker pull "$IMG:$svc-$VER"
            docker tag  "$IMG:$svc-$VER" "$IMG:$svc"
            docker push "$IMG:$svc"
          done
          echo "### 回滚/定点发布：\`$VER\` 已提升为当前 tag" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: deploy to B (restricted key)
    needs: [build-push, promote]
    if: ${{ always() && (needs.build-push.result == 'success' || needs.promote.result == 'success') }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Prepare SSH key
        env:
          B_SSH_KEY_B64: ${{ secrets.B_SSH_KEY_B64 }}
          B_SSH_KEY: ${{ secrets.B_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          if [ -n "${B_SSH_KEY_B64:-}" ]; then
            printf '%s' "$B_SSH_KEY_B64" | base64 -d > ~/.ssh/b_deploy
          else
            printf '%s\n' "$B_SSH_KEY" | tr -d '\r' > ~/.ssh/b_deploy
          fi
          chmod 600 ~/.ssh/b_deploy
          echo "key fingerprint: $(ssh-keygen -lf ~/.ssh/b_deploy)"

      - name: Trigger remote deploy over SSH
        env:
          B_HOST: ${{ secrets.B_HOST }}
          B_USER: ${{ secrets.B_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/b_deploy -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
              "$B_USER@$B_HOST" deploy

      - name: Smoke test
        run: |
          set -euo pipefail
          for i in $(seq 1 6); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 10 https://we1l.site/api/works || true)
            if [ "$code" = "200" ]; then echo "SMOKE_OK: /api/works -> 200"; exit 0; fi
            echo "attempt $i: got '$code', retry…"; sleep 5
          done
          echo "SMOKE_FAILED"; exit 1
