# we1l.site —— Nginx 反代配置（容器版）
# 证书由宿主 certbot 管理，经 /etc/letsencrypt:ro 挂载
# HTTP-01 挑战文件由宿主 certbot 写入 ./certbot，经 :ro 挂载对外暴露

# ---------- HTTP：ACME 挑战放行 + 全量 301 到 HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name we1l.site www.we1l.site;

    # certbot HTTP-01 挑战：宿主 certbot 写入 HOST_CERTBOT_DIR，nginx 在此对外暴露
    # ⚠️ 宿主 certbot 的 --webroot-path 必须指向该宿主机目录，否则续期失败
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS：主站点 ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name we1l.site www.we1l.site;

    # [merged from docker-nginx 实验] 生产加固
    server_tokens off;                       # 隐藏 nginx 版本号
    gzip on;                                 # 压缩静态/JSON 响应
    gzip_types text/css application/javascript application/json image/svg+xml;
    access_log /dev/stdout;                  # 日志走 stdout，docker logs 可见
    error_log  /dev/stderr;

    # SSL（certbot 托管，宿主挂载 :ro）
    ssl_certificate     /etc/letsencrypt/live/www.we1l.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.we1l.site/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 10m;                # 上传别再炸

    root /usr/share/nginx/html;
    index index.html;

    # 带 hash 的 Vue 产物长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 静态资源长缓存
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 后端 API 反代
    # 前端 baseURL=/api，后端路由本身带 /api 前缀（如 /api/works、/api/admin/...）
    # 关键：proxy_pass 末尾不带 URI（即 http://backend:8080），完整请求 URI 透传，
    # 后端收到 /api/works；切勿写成 http://backend:8080/ （空斜杠会剥掉 /api 段 → 404）
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    # 后台上传的图片（笔记缩略图等）：由后端 /uploads/** 静态提供，需反代
    # ⚠️ 必须用 ^~ 前缀匹配：否则会被上面的正则 location（\.png|jpg|...）截胡，
    #     nginx 会去 root 目录找文件而返回 404。
    location ^~ /uploads/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # SPA history 路由回退（Vue Router 的 /about、/notes 等前端路由）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 隐藏文件/目录（含 .env、.git 等）
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
