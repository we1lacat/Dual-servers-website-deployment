# ============================================================
# Nginx 容器配置模板（挂载到 /etc/nginx/conf.d/default.conf）
#   - 证书由宿主 certbot 管理（/etc/letsencrypt 只读挂载）
#   - ACME webroot 由宿主 certbot 写入（HOST_CERTBOT_DIR 挂载）
#   - 前端静态产物已烘焙进本镜像（见 frontend-Dockerfile）
# ============================================================

# ---------- HTTP：ACME 挑战放行 + 全量 301 到 HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # certbot HTTP-01 挑战：宿主 certbot 写入 HOST_CERTBOT_DIR，nginx 在此对外暴露
    # ⚠️ 宿主 certbot 的 --webroot-path 必须指向同一宿主机目录，否则续期失败
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS：主站点 ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name example.com www.example.com;

    # 基础加固
    server_tokens off;                       # 隐藏 nginx 版本号
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    access_log /dev/stdout;                  # 日志走 stdout，docker logs 可见
    error_log  /dev/stderr;

    # SSL（certbot 托管，宿主挂载 :ro）
    # ⚠️ live/<证书名> 必须与签发时的 --cert-name 一致（见 docs/05 #8）
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 10m;

    root /usr/share/nginx/html;
    index index.html;

    # 带 hash 的前端构建产物：长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 其他静态资源
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 后端 API 反代
    # 关键：proxy_pass 末尾【不带 URI】（即 http://backend:8080），完整请求 URI 透传；
    # 切勿写成 http://backend:8080/ ——空斜杠会剥掉 /api 段导致后端 404（见 docs/05 #9）
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    # SPA history 路由回退（前端路由刷新不 404）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 隐藏文件/目录（含 .env、.git 等）
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
